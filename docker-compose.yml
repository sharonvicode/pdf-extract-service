services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    image: extractor-service:latest
    container_name: extractor-service
    ports:
      - "${PORT:-8000}:8000"
    # Optional: without a .env file the service runs with the defaults from app/core/config.py.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
